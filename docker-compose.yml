
version: '3'

services:

  airflow:

    image: apache/airflow:2.10.0

    container_name: airflow

    ports:

      - "8080:8080"

    volumes:

      - ./dags:/opt/airflow/dags

      - ./logs:/opt/airflow/logs

      - ./plugins:/opt/airflow/plugins

    env_file:

      - .env

    restart: always