name: Enterprise ETL CI

on:

  push:

    branches:

      - main

  pull_request:

    branches:

      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4

    - name: Python

      uses: actions/setup-python@v5

      with:

        python-version: "3.11"

    - name: Install

      run: |

        pip install -r requirements.txt

    - name: Run Tests

      run: |

        pytest

    - name: Lint

      run: |

        pip install flake8

        flake8 scripts
